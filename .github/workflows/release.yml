name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A newer queued run waits and tags whatever landed
# on main after the run that is already in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      part: ${{ steps.tag.outputs.part }}
      release: ${{ steps.record.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release only untagged commits
        id: gate
        run: |
          set -euo pipefail
          git fetch origin '+refs/tags/*:refs/tags/*'
          if git log -1 --format=%B | grep -F '[skip release]' >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Bump version and push tag
        if: steps.gate.outputs.release == 'true'
        id: tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0
          MAJOR_PATTERN: "BREAKING CHANGE"
          # feat!: also major via conventional commits in action defaults when enabled
      - name: Record release
        id: record
        if: steps.tag.outputs.part == 'major' || steps.tag.outputs.part == 'minor' || steps.tag.outputs.part == 'patch'
        run: echo "release=true" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/azkvns/spur-gateway
          tags: |
            type=raw,value=${{ needs.version.outputs.new_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SING_BOX_ARCH=amd64

  github_release:
    needs: [version, image]
    if: needs.version.result == 'success' && needs.version.outputs.release == 'true' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            docker pull ghcr.io/azkvns/spur-gateway:${{ needs.version.outputs.new_tag }}
            docker pull ghcr.io/azkvns/spur-gateway:latest
            ```
